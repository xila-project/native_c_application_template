[vars]
app_name = "hello"
core_revision = "4785f3931f295dd24b87a7f58204cb676d960589"
# Entry symbol of the statically linked archive: a C identifier derived from app_name.
linked_entry = "xila_linked_{{ vars.app_name }}"
host_target = "x86_64-unknown-linux-gnu"
uv_version = "0.12.19"
clang_format_version = "19.1.7"
taplo_version = "0.10.0"
actionlint_version = "1.7.7"
shellcheck_version = "0.11.0"

[tasks."sdk:build"]
description = "Build and unpack the pinned Xila C SDK for XILA_SDK_TARGET"
usage = 'flag "--install-packages" help="Install Core’s Debian/Ubuntu SDK packages before building"'
run = """
set -eu
export XILA_SDK_TARGET="${XILA_SDK_TARGET:-{{ vars.host_target }}}"
case "$XILA_SDK_TARGET" in
  x86_64-unknown-linux-gnu) packages=ci:packages-sdk ;;
  thumbv7em-none-eabihf) packages=ci:packages-sdk-arm ;;
  riscv32imac-unknown-none-elf) packages=ci:packages-sdk-riscv ;;
  *) echo "Unsupported SDK target: $XILA_SDK_TARGET" >&2; exit 1 ;;
esac

revision="{{ vars.core_revision }}"
root="$PWD"
core="$root/target/core/$revision"
mkdir -p "$(dirname "$core")"
# The target builds share Core's picolibc source cache.
exec 9>"$core.lock"
flock 9
if [ ! -d "$core/.git" ]; then
  git init --quiet "$core"
fi
if ! git -C "$core" cat-file -e "$revision^{commit}" 2>/dev/null; then
  git -C "$core" fetch --depth=1 --no-tags https://github.com/xila-project/core.git "$revision"
fi
if [ "$(git -C "$core" rev-parse --verify --quiet HEAD || true)" != "$revision" ]; then
  git -C "$core" checkout --quiet --detach "$revision"
fi
(
  cd "$core"
  # Stop mise's config search at this repository so its [tools] and [vars] stay
  # out of Core's build. Its [env] is already exported to this task and still
  # reaches Core (see the README).
  export MISE_CEILING_PATHS="$root${MISE_CEILING_PATHS:+:$MISE_CEILING_PATHS}"
  if [ "${usage_install_packages:-false}" = true ]; then
    mise -E ci run "$packages"
  fi
  mise run sdk:build
)

set -- "$core/target/sdk"/xila-sdk-*-"$XILA_SDK_TARGET".tar.zst
if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
  echo "Expected one Xila SDK archive for $XILA_SDK_TARGET." >&2
  exit 1
fi
sdk="$PWD/target/sdk/$XILA_SDK_TARGET"
mkdir -p "$sdk"
staging=$(mktemp -d "$sdk/sdk.XXXXXX")
tar --zstd --extract --file "$1" --directory "$staging" --strip-components=1
# Core currently ships the checker in its source tree.
cp "$core/tools/sdk/check_elf.py" "$staging/check_elf.py"
ln -s "${staging##*/}" "$staging/current"
mv -Tf "$staging/current" "$sdk/current"
"""

[tasks.build]
description = "Build the application for XILA_SDK_TARGET after sdk:build"
run = """
set -eu
target="${XILA_SDK_TARGET:-{{ vars.host_target }}}"
sdk="$PWD/target/sdk/$target/current"
test -f "$sdk/cmake/xila-toolchain.cmake" || { echo "Run mise run sdk:build for $target first." >&2; exit 1; }
# Keep the CMake cache with the SDK that configured it.
sdk=$(cd "$sdk" && pwd -P)
cmake -S . -B "$sdk/build" \\
  -DCMAKE_TOOLCHAIN_FILE="$sdk/cmake/xila-toolchain.cmake" \\
  -DXILA_APP_NAME="{{ vars.app_name }}" -DCMAKE_BUILD_TYPE=MinSizeRel
cmake --build "$sdk/build"
"""

[tasks."build:linked"]
description = "Build the application as a statically linked archive for XILA_SDK_TARGET after sdk:build"
tools.uv = "{{ vars.uv_version }}"
run = """
set -eu
target="${XILA_SDK_TARGET:-{{ vars.host_target }}}"
sdk="target/sdk/$target/current"
test -f "$sdk/cmake/xila-toolchain.cmake" || { echo "Run mise run sdk:build for $target first." >&2; exit 1; }
# Keep the CMake cache with the SDK that configured it.
sdk=$(cd "$sdk" && pwd -P)
cmake -S . -B "$sdk/build" \\
  -DCMAKE_TOOLCHAIN_FILE="$sdk/cmake/xila-toolchain.cmake" \\
  -DXILA_APP_NAME="{{ vars.app_name }}" -DCMAKE_BUILD_TYPE=MinSizeRel
# The object library is shared by the ELF and the archive: build only it here.
cmake --build "$sdk/build" --target "{{ vars.app_name }}_objects"
objdir="$sdk/build/CMakeFiles/{{ vars.app_name }}_objects.dir"
# CMAKE_SYSTEM_NAME is Generic, so CMake names objects .obj; match .o too for UNIX-like setups.
objects=$(find "$objdir" -type f \\( -name '*.o' -o -name '*.obj' \\) | LC_ALL=C sort)
if [ -z "$objects" ]; then
  echo "No object files under $objdir." >&2
  exit 1
fi
# link-archive runs from the pinned Core checkout: it resolves its own root there and
# reads nothing else from it (only `build` reads Core's mise.toml).
core="$PWD/target/core/{{ vars.core_revision }}"
test -f "$core/tools/sdk/build.py" || { echo "Run mise run sdk:build first: $core/tools/sdk/build.py is missing." >&2; exit 1; }
# shellcheck disable=SC2086
uv run --no-project python "$core/tools/sdk/build.py" link-archive \\
  --sdk "$sdk" --entry "{{ vars.linked_entry }}" --output "$sdk/build/lib{{ vars.app_name }}.a" $objects
"""

[tasks.check]
description = "Check the built ELF against Xila's loader and target requirements"
tools.uv = "{{ vars.uv_version }}"
run = """
set -eu
target="${XILA_SDK_TARGET:-{{ vars.host_target }}}"
case "$target" in
  x86_64-unknown-linux-gnu) set -- --machine x86_64 ;;
  thumbv7em-none-eabihf) set -- --machine arm --float-abi hard ;;
  riscv32imac-unknown-none-elf) set -- --machine riscv32 --float-abi soft ;;
  *) echo "Unsupported SDK target: $target" >&2; exit 1 ;;
esac
sdk="target/sdk/$target/current"
test -f "$sdk/sdk.json" || { echo "Run mise run sdk:build for $target first." >&2; exit 1; }
sdk=$(cd "$sdk" && pwd -P)
abi=$(uv run --no-project python -c 'import json, sys; print(json.load(open(sys.argv[1]))["abi"])' "$sdk/sdk.json")
uv run --no-project python "$sdk/check_elf.py" "$sdk/build/{{ vars.app_name }}.elf" --abi "$abi" "$@"
"""

[tasks."check:linked"]
description = "Check the linked archive: only the entry is a global defined symbol, nothing is undefined"
run = """
set -eu
target="${XILA_SDK_TARGET:-{{ vars.host_target }}}"
sdk="target/sdk/$target/current"
test -f "$sdk/sdk.json" || { echo "Run mise run sdk:build for $target first." >&2; exit 1; }
sdk=$(cd "$sdk" && pwd -P)
archive="$sdk/build/lib{{ vars.app_name }}.a"
test -f "$archive" || { echo "Run mise run build:linked for $target first." >&2; exit 1; }
entry="{{ vars.linked_entry }}"
# llvm-nm from PATH, or next to clang: the same lookup as the SDK build.py find_tool.
nm=$(command -v llvm-nm 2>/dev/null || true)
if [ -z "$nm" ]; then
  candidate=$(clang -print-prog-name=llvm-nm)
  case "$candidate" in
    /*) if [ -x "$candidate" ]; then nm=$candidate; fi ;;
  esac
fi
if [ -z "$nm" ]; then
  echo "llvm-nm not found; install LLVM (clang, lld, llvm-ar)" >&2
  exit 1
fi
# The only global defined symbol must be the entry, a text (T) symbol.
defined=$("$nm" --defined-only --format=posix "$archive" | awk 'NF >= 2 && $2 ~ /^[A-Z]$/ { print $1, $2 }')
if [ "$defined" != "$entry T" ]; then
  echo "check:linked: the only global defined symbol of $archive must be '$entry T', got:" >&2
  printf '%s\n' "$defined" >&2
  exit 1
fi
# No weak undefined (w/v) symbol may survive, and no strong undefined (U) one except
# the symbols the firmware itself provides.
weak=$("$nm" --undefined-only --format=posix "$archive" | awk 'NF >= 2 && ($2 == "w" || $2 == "v") { print $1 }')
strong=$("$nm" --undefined-only --format=posix "$archive" | awk 'NF >= 2 && $2 == "U" && $1 != "__xila_current_startup" { print $1 }')
if [ -n "$weak" ] || [ -n "$strong" ]; then
  echo "check:linked: $archive must have no weak undefined (w/v) and no unexpected strong undefined (U) symbol, got:" >&2
  printf '%s\n' "$weak" "$strong" >&2
  exit 1
fi
echo "check:linked: $archive exposes only $entry (T) as a global symbol and nothing undefined"
"""

[tasks."ci:format-rust"]
description = "Satisfy the shared quality workflow for this C-only repository"
run = "true"

[tasks."ci:format-c"]
description = "Check formatting of tracked C sources and headers"
tools.uv = "{{ vars.uv_version }}"
run = "git ls-files -z -- '*.c' '*.h' | xargs -0 -r uvx --from clang-format=={{ vars.clang_format_version }} clang-format --style=file --dry-run --Werror --"

[tasks."format:c"]
description = "Format tracked C sources and headers"
tools.uv = "{{ vars.uv_version }}"
run = "git ls-files -z -- '*.c' '*.h' | xargs -0 -r uvx --from clang-format=={{ vars.clang_format_version }} clang-format --style=file -i --"

[tasks."ci:format-toml"]
description = "Check TOML formatting"
tools.taplo = "{{ vars.taplo_version }}"
run = "taplo format --check mise.toml"

[tasks."ci:lint-workflows"]
description = "Lint GitHub Actions workflows"
tools."aqua:rhysd/actionlint" = "{{ vars.actionlint_version }}"
tools."aqua:koalaman/shellcheck" = "{{ vars.shellcheck_version }}"
run = "actionlint"
